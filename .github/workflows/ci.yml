name: PyNFe CI
on: [pull_request, push]
jobs:
  build:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Migracao ws360 (Fase 2): alvo 3.12/3.13; 3.14 e o burndown final.
        # 3.14 falha de proposito enquanto o extra NFS-e depender de PyXB-X
        # (legado py2, sem suporte a 3.14) -> continue-on-error nao bloqueia.
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-nfse.txt
          pip install -r requirements-dev.txt
      - name: Ruff (informativo, nao bloqueia)
        continue-on-error: true
        run: ruff check .
      - name: Tests
        run: pytest -v
